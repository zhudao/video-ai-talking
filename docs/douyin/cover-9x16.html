<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>抖音封面 9:16</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1118; }
      .stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        color: #f4f1ea;
        font-family: "Hiragino Sans GB", "PingFang SC", "Heiti SC", sans-serif;
        background:
          radial-gradient(ellipse 90% 55% at 50% 38%, #2a3f55 0%, transparent 62%),
          radial-gradient(ellipse 70% 40% at 78% 78%, #3a2018 0%, transparent 55%),
          linear-gradient(180deg, #101821 0%, #0b1118 100%);
      }
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.16;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .sprocket {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 56px;
        background: #c81e1e;
      }
      .sprocket::before {
        content: "";
        position: absolute;
        inset: 36px 16px;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 28px,
          #0b1118 28px 52px
        );
      }
      .safe {
        position: absolute;
        left: 92px;
        right: 140px;
        top: 280px;
        bottom: 280px;
        display: flex;
        flex-direction: column;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 28px;
        letter-spacing: 0.28em;
        color: #d7b07a;
        font-weight: 600;
      }
      .eyebrow i {
        display: block;
        width: 42px;
        height: 3px;
        background: #d7b07a;
      }
      h1 {
        margin-top: 36px;
        font-size: 168px;
        line-height: 0.92;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      }
      h1 span { display: block; }
      .sub {
        margin-top: 36px;
        font-size: 42px;
        line-height: 1.35;
        font-weight: 500;
        color: #e8e2d6;
        letter-spacing: 0.08em;
      }
      .row {
        margin-top: auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 28px;
      }
      .phone {
        width: 280px;
        height: 500px;
        border: 6px solid #f4f7fa;
        border-radius: 36px;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.08), transparent 30%),
          #1d3348;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        position: relative;
        overflow: hidden;
        flex: none;
      }
      .phone .notch {
        position: absolute;
        top: 14px;
        left: 50%;
        width: 88px;
        height: 10px;
        margin-left: -44px;
        border-radius: 99px;
        background: #0b1118;
      }
      .face {
        position: absolute;
        left: 36px;
        right: 36px;
        top: 86px;
        height: 250px;
        border-radius: 18px;
        background:
          radial-gradient(circle at 50% 38%, #e8c4a2 0 28%, transparent 29%),
          linear-gradient(180deg, #3a5168, #243646);
      }
      .bars {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 56px;
        height: 54px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
      }
      .bars b {
        flex: 1;
        background: #f4f7fa;
        border-radius: 3px;
      }
      .bars b:nth-child(1) { height: 28%; }
      .bars b:nth-child(2) { height: 62%; }
      .bars b:nth-child(3) { height: 100%; }
      .bars b:nth-child(4) { height: 48%; }
      .bars b:nth-child(5) { height: 76%; }
      .bars b:nth-child(6) { height: 36%; }
      .stamp {
        width: 196px;
        height: 196px;
        border: 8px solid #c81e1e;
        color: #c81e1e;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.16em;
        line-height: 1.25;
        transform: rotate(-12deg);
        background: rgba(11, 17, 24, 0.35);
      }
      .foot {
        margin-top: 40px;
        font-size: 26px;
        letter-spacing: 0.22em;
        color: #8fa3b5;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="sprocket"></div>
      <div class="grain"></div>
      <div class="safe">
        <div class="eyebrow"><i></i>AI 真人口播</div>
        <h1><span>不用</span><span>自己念</span></h1>
        <p class="sub">写好字幕，自动对口型<br />密钥只留在你电脑里</p>
        <div class="row">
          <div class="phone" aria-hidden="true">
            <div class="notch"></div>
            <div class="face"></div>
            <div class="bars"><b></b><b></b><b></b><b></b><b></b><b></b></div>
          </div>
          <div class="stamp">本机<br />出片</div>
        </div>
        <p class="foot">video-ai-talking</p>
      </div>
    </div>
  </body>
</html>
